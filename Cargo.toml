[package]
name = "lispm-site"
version = "0.2.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "LispM's website: what LispM is, told with its films, built with Yew"
repository = "https://github.com/LispMachineLab/LispMachineLab.github.io"
publish = false

[dependencies]
gloo-timers = "0.4"
js-sys = "0.3"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "Clipboard",
    "Document",
    "Element",
    "HtmlMediaElement",
    "HtmlVideoElement",
    "IntersectionObserver",
    "IntersectionObserverEntry",
    "IntersectionObserverInit",
    "Location",
    "MediaQueryList",
    "Navigator",
    "Window",
] }
yew = { version = "0.23", features = ["csr"] }

[lints.rust]
missing_docs = "deny"

[lints.clippy]
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
